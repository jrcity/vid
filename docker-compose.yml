version: '3.9'

services:
  backend:
    build:
      context: ./vid-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: change_this_to_a_random_64_char_string
      NOKIA_NAC_TOKEN: ${NOKIA_NAC_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CERTIFICATE_STORE_PATH: /data/certificates.db
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-http://localhost:8000/api/v1/verify}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
      RATE_LIMIT_ENROLL: ${RATE_LIMIT_ENROLL:-20/minute}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 50s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      # The UI uses relative API paths and nginx proxies /api/ to backend.
      NODE_ENV: production

volumes:
  backend-data:
